name: Deploy Party Royale Web Prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "party-royale/**"
      - ".github/workflows/deploy-party-royale.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "party-royale-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p public
          cp party-royale/index.html public/index.html
          cat > public/README.txt <<'EOF'
          PARTY ROYALE — Neon Knockout
          Web prototype build.
          Requires an internet connection to load Three.js from jsDelivr CDN.
          This is a single-player prototype, not yet online multiplayer.
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
